[project]
name = "rash-observability"
version = "0.1.0"
description = "Shared LangFuse observability context manager for Rash agents"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=3.3.4",
    "logfire>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rash_observability"]
